spring.application.name=sequelas-backend
server.port=${PORT:8080}

# H2 local (para desenvolvimento, mas o Render usará PostgreSQL via variáveis)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:rpgdb}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Para H2 (não usado em produção)
spring.h2.console.enabled=false
