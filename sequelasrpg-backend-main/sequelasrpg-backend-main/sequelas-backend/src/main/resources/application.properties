spring.application.name=sequelas-backend
server.port=${PORT:8080}

# Configuração do Banco de Dados
# Se a variável JDBC_DATABASE_URL existir (no Render), usa PostgreSQL.
# Senão, usa H2 em memória (para testes locais).
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:rpgdb}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

# Driver do PostgreSQL (sempre carregado, mas só usado se a URL for PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto do Hibernate – será sobrescrito pela variável de ambiente no Render
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desliga o console H2 (não usado em produção)
spring.h2.console.enabled=false
