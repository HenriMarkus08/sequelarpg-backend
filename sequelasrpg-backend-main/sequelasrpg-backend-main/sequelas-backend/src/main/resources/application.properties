spring.application.name=sequelas-backend

# =========================================================
# CONFIGURAÇÃO LOCAL (H2 - Banco em Memória)
# =========================================================
spring.datasource.url=jdbc:h2:mem:rpgdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o Console Web do H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# =========================================================
# Cria e atualiza as tabelas automaticamente no banco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false